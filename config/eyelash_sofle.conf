# go to sleep after one hour (1*60*60*1000ms)

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

CONFIG_ZMK_SLEEP=y

#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#The maximum brightness percentage of RGB，Reducing this value can lower the temperature of the rectifier components.(RGB的最大百分比亮度，降低可以减少发热）
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60



# MOUSE
CONFIG_ZMK_MOUSE=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

# Display: NAO ligar aqui (esta conf vale pro dongle E pras metades).
# O OLED fica ligado so no dongle (eyelash_sofle_central_dongle.conf);
# nas metades esta desligado pra economizar bateria.
#CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

#macos logo open this config
#CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y

# Soft off (upstream 576b519): habilita o behavior &soft_off usado no keymap
# (combo 14+28+40 e camada BT). Metades acordam com qualquer tecla (kscan
# wakeup-source); o dongle, por ser USB, acorda desplugando/plugando ou reset.
CONFIG_ZMK_PM_SOFT_OFF=y



